<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="khoyaBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="60%" stop-color="#FCEFD7" />
      <stop offset="100%" stop-color="#F5DBB0" />
    </radialGradient>

    <!-- Kulfi Body Gradient (Caramelized Desi Khoya) -->
    <linearGradient id="khoyaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E8" />
      <stop offset="25%" stop-color="#FCDCA0" />
      <stop offset="70%" stop-color="#EAA64E" />
      <stop offset="100%" stop-color="#B86F21" />
    </linearGradient>

    <!-- Stick Gradient -->
    <linearGradient id="stickK" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8824A" />
      <stop offset="40%" stop-color="#E2B77D" />
      <stop offset="70%" stop-color="#F1CF9E" />
      <stop offset="100%" stop-color="#9E6B35" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadowK" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#4A1D0A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#khoyaBg)" />

  <!-- Floating Caramel Drops & Sparkles -->
  <g fill="#D97706" opacity="0.8">
    <path d="M85 135 Q100 135 100 120 Q100 135 115 135 Q100 135 100 150 Q100 135 85 135 Z" />
    <path d="M385 105 Q400 105 400 90 Q400 105 415 105 Q400 105 400 120 Q400 105 385 105 Z" />
    <!-- Floating Almond Slivers in background -->
    <ellipse cx="105" cy="275" rx="10" ry="5" transform="rotate(-35 105 275)" fill="#FBBF24" opacity="0.6" />
    <ellipse cx="395" cy="285" rx="10" ry="5" transform="rotate(30 395 285)" fill="#FBBF24" opacity="0.6" />
  </g>

  <!-- Kulfi Character Group -->
  <g filter="url(#softShadowK)">
    <!-- Wooden Stick -->
    <g id="stickGroupK">
      <rect x="235" y="320" width="30" height="130" rx="15" fill="url(#stickK)" />
      <line x1="242" y1="340" x2="242" y2="430" stroke="#9E6B35" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6" />
      <line x1="256" y1="335" x2="256" y2="435" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.5" />
    </g>

    <!-- Kulfi Tapered Body -->
    <g id="kulfiBodyK">
      <path d="M 180,335 C 172,320 188,110 206,80 C 220,58 280,58 294,80 C 312,110 328,320 320,335 C 314,346 186,346 180,335 Z" fill="url(#khoyaBody)" />

      <!-- Rich caramelized rabri drip on top -->
      <path d="M 205,82 C 220,60 280,60 295,82 C 298,105 288,125 282,115 C 278,108 274,135 266,138 C 258,142 254,115 248,118 C 242,122 238,140 230,136 C 224,132 222,112 216,118 C 210,125 204,105 205,82 Z" fill="#92400E" opacity="0.75" />

      <!-- Specular highlight streak -->
      <path d="M 200,92 C 210,75 240,68 250,68 C 244,140 230,260 220,330 C 210,326 202,316 198,300 C 200,220 196,140 200,92 Z" fill="#FFFBEB" opacity="0.6" />

      <!-- Toasted almond flakes on top -->
      <ellipse cx="232" cy="95" rx="6" ry="3.5" transform="rotate(-30 232 95)" fill="#FEF3C7" stroke="#B45309" stroke-width="0.8" />
      <ellipse cx="268" cy="88" rx="6.5" ry="3.8" transform="rotate(25 268 88)" fill="#FEF3C7" stroke="#B45309" stroke-width="0.8" />
      <ellipse cx="250" cy="120" rx="6" ry="3.5" transform="rotate(10 250 120)" fill="#FEF3C7" stroke="#B45309" stroke-width="0.8" />

      <!-- Kawaii Big Glossy Sparkling Eyes -->
      <!-- Left Eye -->
      <g transform="translate(216, 175)">
        <ellipse cx="0" cy="0" rx="14" ry="17" fill="#451A03" />
        <circle cx="-4" cy="-5" r="6" fill="#FFFFFF" />
        <circle cx="4" cy="6" r="3" fill="#FFFFFF" />
        <!-- Starry shine -->
        <polygon points="3,-2 4,1 7,2 4,3 3,6 2,3 -1,2 2,1" fill="#FEF08A" />
      </g>

      <!-- Right Eye -->
      <g transform="translate(284, 175)">
        <ellipse cx="0" cy="0" rx="14" ry="17" fill="#451A03" />
        <circle cx="-4" cy="-5" r="6" fill="#FFFFFF" />
        <circle cx="4" cy="6" r="3" fill="#FFFFFF" />
        <polygon points="3,-2 4,1 7,2 4,3 3,6 2,3 -1,2 2,1" fill="#FEF08A" />
      </g>

      <!-- Rosy Cheeks -->
      <ellipse cx="198" cy="195" rx="13" ry="7.5" fill="#FB7185" opacity="0.85" />
      <ellipse cx="302" cy="195" rx="13" ry="7.5" fill="#FB7185" opacity="0.85" />

      <!-- Sweet Cheerful Big Smile with Heart Sparkle -->
      <path d="M 235,195 Q 250,220 265,195" stroke="#451A03" stroke-width="4.5" stroke-linecap="round" fill="#DC2626" />
      <path d="M 242,204 Q 250,215 258,204 Z" fill="#F43F5E" />
    </g>
  </g>

  <!-- Cute Flavor Pill Badge -->
  <g transform="translate(250, 460)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#451A03" />
    <text x="0" y="6" text-anchor="middle" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="1">
      PURE KHOYA BADAMI
    </text>
  </g>
</svg>
