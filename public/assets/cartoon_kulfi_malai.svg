<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="60%" stop-color="#FDF3DB" />
      <stop offset="100%" stop-color="#F7E5BD" />
    </radialGradient>

    <!-- Kulfi Body Gradient (Creamy Malai Milk) -->
    <linearGradient id="malaiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF9E8" />
      <stop offset="70%" stop-color="#F7E6BD" />
      <stop offset="100%" stop-color="#E5CAA0" />
    </linearGradient>

    <!-- Stick Gradient -->
    <linearGradient id="stick" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8824A" />
      <stop offset="40%" stop-color="#E2B77D" />
      <stop offset="70%" stop-color="#F1CF9E" />
      <stop offset="100%" stop-color="#9E6B35" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#652609" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Floating Cute Doodles (Stars, Hearts, Sparkles) -->
  <g fill="#F7C744" opacity="0.85">
    <!-- Sparkle 1 -->
    <path d="M90 120 Q105 120 105 105 Q105 120 120 120 Q105 120 105 135 Q105 120 90 120 Z" />
    <!-- Sparkle 2 -->
    <path d="M380 90 Q395 90 395 75 Q395 90 410 90 Q395 90 395 105 Q395 90 380 90 Z" />
    <!-- Star small -->
    <polygon points="400,240 405,255 420,255 408,265 412,280 400,270 388,280 392,265 380,255 395,255" fill="#E67A19" opacity="0.6" />
  </g>
  <g fill="#FF8BA7" opacity="0.75">
    <!-- Heart 1 -->
    <path d="M110 320 C100 305 75 315 75 330 C75 348 110 368 110 368 C110 368 145 348 145 330 C145 315 120 305 110 320 Z" transform="scale(0.6) translate(80, 200)" />
    <!-- Little Heart 2 -->
    <path d="M110 320 C100 305 75 315 75 330 C75 348 110 368 110 368 C110 368 145 348 145 330 C145 315 120 305 110 320 Z" transform="scale(0.5) translate(660, -320)" />
  </g>

  <!-- Kulfi Character Group with Soft Shadow -->
  <g filter="url(#softShadow)">
    <!-- Wooden Stick -->
    <g id="stickGroup">
      <rect x="235" y="320" width="30" height="130" rx="15" fill="url(#stick)" />
      <!-- Stick wood grain -->
      <line x1="242" y1="340" x2="242" y2="430" stroke="#9E6B35" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6" />
      <line x1="256" y1="335" x2="256" y2="435" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.5" />
    </g>

    <!-- Kulfi Tapered Body -->
    <g id="kulfiBody">
      <!-- Main conical shape with rounded top dome -->
      <path d="M 180,335 C 172,320 188,110 206,80 C 220,58 280,58 294,80 C 312,110 328,320 320,335 C 314,346 186,346 180,335 Z" fill="url(#malaiBody)" />

      <!-- Inner milk shine / specular highlight -->
      <path d="M 200,92 C 210,75 240,68 250,68 C 244,140 230,260 220,330 C 210,326 202,316 198,300 C 200,220 196,140 200,92 Z" fill="#FFFFFF" opacity="0.6" />

      <!-- Sprinkled crushed pistachios on top -->
      <ellipse cx="230" cy="95" rx="6" ry="3.5" transform="rotate(-20 230 95)" fill="#54992E" />
      <ellipse cx="265" cy="110" rx="7" ry="4" transform="rotate(30 265 110)" fill="#427A23" />
      <ellipse cx="282" cy="85" rx="5" ry="3" transform="rotate(-15 282 85)" fill="#68B837" />
      <ellipse cx="215" cy="130" rx="5.5" ry="3.5" transform="rotate(40 215 130)" fill="#5EA832" />
      <circle cx="250" cy="80" r="2.5" fill="#3D1D06" />
      <circle cx="270" cy="135" r="2.5" fill="#3D1D06" />

      <!-- Kawaii Big Glossy Cartoon Eyes -->
      <!-- Left Eye -->
      <g transform="translate(216, 175)">
        <ellipse cx="0" cy="0" rx="14" ry="17" fill="#4A1D0A" />
        <!-- Big eye sparkle highlight -->
        <circle cx="-4" cy="-5" r="6" fill="#FFFFFF" />
        <!-- Small eye secondary sparkle -->
        <circle cx="4" cy="6" r="3" fill="#FFFFFF" />
      </g>

      <!-- Right Eye -->
      <g transform="translate(284, 175)">
        <ellipse cx="0" cy="0" rx="14" ry="17" fill="#4A1D0A" />
        <!-- Big eye sparkle highlight -->
        <circle cx="-4" cy="-5" r="6" fill="#FFFFFF" />
        <!-- Small eye secondary sparkle -->
        <circle cx="4" cy="6" r="3" fill="#FFFFFF" />
      </g>

      <!-- Rosy Cheeks -->
      <ellipse cx="198" cy="195" rx="12" ry="7" fill="#FF8BA7" opacity="0.8" />
      <ellipse cx="302" cy="195" rx="12" ry="7" fill="#FF8BA7" opacity="0.8" />

      <!-- Sweet Big Joyful Smile -->
      <path d="M 235,195 Q 250,218 265,195" stroke="#4A1D0A" stroke-width="4.5" stroke-linecap="round" fill="#E63946" />
      <!-- Smile cute tongue -->
      <path d="M 242,204 Q 250,214 258,204 Z" fill="#FF8BA7" />

      <!-- Melting sweet cream drops at bottom -->
      <path d="M 188,336 Q 194,348 200,336" fill="url(#malaiBody)" />
      <path d="M 298,336 Q 306,350 312,336" fill="url(#malaiBody)" />
    </g>
  </g>

  <!-- Cute Flavor Pill Badge -->
  <g transform="translate(250, 460)">
    <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#542008" />
    <text x="0" y="6" text-anchor="middle" fill="#FFF9EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="1">
      MALAI MILK KULFI
    </text>
  </g>
</svg>
