<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="pistaBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FCFFF5" />
      <stop offset="60%" stop-color="#EDF7D9" />
      <stop offset="100%" stop-color="#D7EDB2" />
    </radialGradient>

    <!-- Kulfi Body Gradient (Pistachio Green) -->
    <linearGradient id="pistaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FCE3" />
      <stop offset="25%" stop-color="#D9F99D" />
      <stop offset="70%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>

    <!-- Stick Gradient -->
    <linearGradient id="stickP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8824A" />
      <stop offset="40%" stop-color="#E2B77D" />
      <stop offset="70%" stop-color="#F1CF9E" />
      <stop offset="100%" stop-color="#9E6B35" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadowP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#365314" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#pistaBg)" />

  <!-- Floating Pistachio Leaf Doodles & Sparkles -->
  <g fill="#65A30D" opacity="0.75">
    <path d="M85 130 Q100 130 100 115 Q100 130 115 130 Q100 130 100 145 Q100 130 85 130 Z" />
    <path d="M385 100 Q400 100 400 85 Q400 100 415 100 Q400 100 400 115 Q400 100 385 100 Z" />
    <!-- Pistachio nut doodles in background -->
    <ellipse cx="105" cy="280" rx="12" ry="7" transform="rotate(-30 105 280)" fill="#84CC16" opacity="0.6" />
    <ellipse cx="395" cy="270" rx="12" ry="7" transform="rotate(40 395 270)" fill="#84CC16" opacity="0.6" />
  </g>

  <!-- Kulfi Character Group -->
  <g filter="url(#softShadowP)">
    <!-- Wooden Stick -->
    <g id="stickGroupP">
      <rect x="235" y="320" width="30" height="130" rx="15" fill="url(#stickP)" />
      <line x1="242" y1="340" x2="242" y2="430" stroke="#9E6B35" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6" />
      <line x1="256" y1="335" x2="256" y2="435" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.5" />
    </g>

    <!-- Kulfi Tapered Body -->
    <g id="kulfiBodyP">
      <path d="M 180,335 C 172,320 188,110 206,80 C 220,58 280,58 294,80 C 312,110 328,320 320,335 C 314,346 186,346 180,335 Z" fill="url(#pistaBody)" />

      <!-- Minty green highlight -->
      <path d="M 200,92 C 210,75 240,68 250,68 C 244,140 230,260 220,330 C 210,326 202,316 198,300 C 200,220 196,140 200,92 Z" fill="#FFFFFF" opacity="0.6" />

      <!-- Topped with rich crushed green pistachios -->
      <ellipse cx="225" cy="90" rx="7" ry="4" transform="rotate(-25 225 90)" fill="#3F6212" />
      <ellipse cx="258" cy="78" rx="8" ry="4.5" transform="rotate(20 258 78)" fill="#4D7C0F" />
      <ellipse cx="280" cy="98" rx="6.5" ry="3.5" transform="rotate(-10 280 98)" fill="#3F6212" />
      <ellipse cx="245" cy="115" rx="7" ry="4" transform="rotate(35 245 115)" fill="#4D7C0F" />
      <ellipse cx="272" cy="130" rx="6" ry="3.2" transform="rotate(-30 272 130)" fill="#3F6212" />

      <!-- Kawaii Super Joyful Laughing Closed Eyes (^ ^) -->
      <!-- Left Happy Curved Eye -->
      <path d="M 205,178 Q 220,158 235,178" stroke="#365314" stroke-width="5.5" stroke-linecap="round" fill="none" />
      <!-- Right Happy Curved Eye -->
      <path d="M 265,178 Q 280,158 295,178" stroke="#365314" stroke-width="5.5" stroke-linecap="round" fill="none" />

      <!-- Cute Anime Eyelash details -->
      <line x1="202" y1="172" x2="196" y2="168" stroke="#365314" stroke-width="3.5" stroke-linecap="round" />
      <line x1="298" y1="172" x2="304" y2="168" stroke="#365314" stroke-width="3.5" stroke-linecap="round" />

      <!-- Cute Blushing Pink Cheeks -->
      <ellipse cx="196" cy="195" rx="13" ry="7.5" fill="#FF8BA7" opacity="0.85" />
      <ellipse cx="304" cy="195" rx="13" ry="7.5" fill="#FF8BA7" opacity="0.85" />

      <!-- Big Heartwarming Kawaii Smile -->
      <path d="M 232,192 Q 250,222 268,192" stroke="#365314" stroke-width="4.5" stroke-linecap="round" fill="#E11D48" />
      <!-- Tongue detail -->
      <path d="M 242,204 Q 250,216 258,204 Z" fill="#FDA4AF" />
    </g>
  </g>

  <!-- Cute Flavor Pill Badge -->
  <g transform="translate(250, 460)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#542008" />
    <text x="0" y="6" text-anchor="middle" fill="#BEF264" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="1">
      PISTACHIO SHAHI KULFI
    </text>
  </g>
</svg>
