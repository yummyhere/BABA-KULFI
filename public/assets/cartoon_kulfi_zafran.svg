<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="zafranBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDF2" />
      <stop offset="60%" stop-color="#FFF3D4" />
      <stop offset="100%" stop-color="#FCE1A2" />
    </radialGradient>

    <!-- Kulfi Body Gradient (Golden Zafran Saffron) -->
    <linearGradient id="zafranBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D4" />
      <stop offset="25%" stop-color="#FDE48A" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#E29412" />
    </linearGradient>

    <!-- Stick Gradient -->
    <linearGradient id="stickZ" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8824A" />
      <stop offset="40%" stop-color="#E2B77D" />
      <stop offset="70%" stop-color="#F1CF9E" />
      <stop offset="100%" stop-color="#9E6B35" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadowZ" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#78350F" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#zafranBg)" />

  <!-- Floating Sparkles & Saffron Threads -->
  <g fill="#F59E0B" opacity="0.85">
    <path d="M80 140 Q95 140 95 125 Q95 140 110 140 Q95 140 95 155 Q95 140 80 140 Z" />
    <path d="M390 110 Q405 110 405 95 Q405 110 420 110 Q405 110 405 125 Q405 110 390 110 Z" />
    <!-- Floating Gold Coin / Bubble -->
    <circle cx="110" cy="270" r="10" fill="#FBBF24" opacity="0.5" />
    <circle cx="390" cy="280" r="14" fill="#FBBF24" opacity="0.5" />
  </g>

  <!-- Kulfi Character Group -->
  <g filter="url(#softShadowZ)">
    <!-- Wooden Stick -->
    <g id="stickGroupZ">
      <rect x="235" y="320" width="30" height="130" rx="15" fill="url(#stickZ)" />
      <line x1="242" y1="340" x2="242" y2="430" stroke="#9E6B35" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.6" />
      <line x1="256" y1="335" x2="256" y2="435" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.5" />
    </g>

    <!-- Kulfi Tapered Body -->
    <g id="kulfiBodyZ">
      <path d="M 180,335 C 172,320 188,110 206,80 C 220,58 280,58 294,80 C 312,110 328,320 320,335 C 314,346 186,346 180,335 Z" fill="url(#zafranBody)" />

      <!-- Golden highlight streak -->
      <path d="M 200,92 C 210,75 240,68 250,68 C 244,140 230,260 220,330 C 210,326 202,316 198,300 C 200,220 196,140 200,92 Z" fill="#FFFBEB" opacity="0.65" />

      <!-- Saffron threads (Zafran strings) draped gracefully on top -->
      <path d="M 220,68 Q 235,90 228,115" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 255,62 Q 268,85 260,110" stroke="#B91C1C" stroke-width="2.8" stroke-linecap="round" fill="none" />
      <path d="M 278,75 Q 288,98 282,122" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 240,118 Q 252,135 246,148" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Pistachio & Almond crumbles -->
      <ellipse cx="238" cy="98" rx="5" ry="3" transform="rotate(-15 238 98)" fill="#54992E" />
      <ellipse cx="270" cy="115" rx="5.5" ry="3" transform="rotate(25 270 115)" fill="#68B837" />

      <!-- Kawaii Playful Winking Face -->
      <!-- Left Eye (Playful Wink Arc with lashes) -->
      <path d="M 206,178 Q 220,162 234,178" stroke="#4A1D0A" stroke-width="5" stroke-linecap="round" fill="none" />
      <line x1="205" y1="172" x2="200" y2="167" stroke="#4A1D0A" stroke-width="3.5" stroke-linecap="round" />

      <!-- Right Eye (Big Sparkling Open Eye) -->
      <g transform="translate(284, 175)">
        <ellipse cx="0" cy="0" rx="14" ry="17" fill="#4A1D0A" />
        <circle cx="-4" cy="-5" r="6" fill="#FFFFFF" />
        <circle cx="4" cy="6" r="3" fill="#FFFFFF" />
      </g>

      <!-- Warm Golden Peach Rosy Cheeks -->
      <ellipse cx="198" cy="195" rx="13" ry="7.5" fill="#F87171" opacity="0.8" />
      <ellipse cx="302" cy="195" rx="13" ry="7.5" fill="#F87171" opacity="0.8" />

      <!-- Adorable Happy Open Smile with playful little tongue -->
      <path d="M 234,194 Q 250,222 266,194" stroke="#4A1D0A" stroke-width="4.5" stroke-linecap="round" fill="#E11D48" />
      <!-- Tongue sticking out playfully -->
      <path d="M 244,204 C 242,216 258,216 256,204 Z" fill="#FB7185" />
    </g>
  </g>

  <!-- Cute Flavor Pill Badge -->
  <g transform="translate(250, 460)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#542008" />
    <text x="0" y="6" text-anchor="middle" fill="#FDE047" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" letter-spacing="1">
      ROYAL ZAFRANI KULFI
    </text>
  </g>
</svg>
